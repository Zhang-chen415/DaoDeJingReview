<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道德經 全篇默寫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #f4f1ea;
            --text-dark: #3e362e;
            --text-accent: #5c5042;
            --border-normal: #c7bcab;
            --border-hover: #8b7d6b;
            --correct-color: #2e7d32;
            --wrong-color: #c62828;
            --missing-color: #9e9e9e;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--text-dark);
            font-family: 'Kaiti TC', 'TW-Kai', 'BiauKai', '楷體', 'Noto Serif TC', serif;
            background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .glass-panel {
            background: rgba(250, 248, 245, 0.95);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2dcd0;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        /* 古典風格的 Checkbox */
        .checkbox-wrapper {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            margin: 0.5rem;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            display: none;
        }
        
        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-hover);
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-custom {
            background-color: var(--text-accent);
            border-color: var(--text-accent);
        }
        
        .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-custom::after {
            content: '✓';
            color: var(--bg-paper);
            font-size: 14px;
            font-family: sans-serif;
            font-weight: bold;
        }

        /* 按鈕樣式 */
        .btn-zen {
            background: var(--text-accent);
            color: var(--bg-paper);
            border: 2px solid var(--text-accent);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-zen:hover {
            background: #4a4035;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(92, 80, 66, 0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-accent);
            border: 2px solid var(--text-accent);
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: var(--text-accent);
            color: var(--bg-paper);
        }

        /* 默寫區塊與排版 */
        textarea {
            width: 100%;
            height: 350px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--border-normal);
            border-radius: 8px;
            padding: 1.5rem;
            font-size: 1.25rem;
            line-height: 2;
            letter-spacing: 0.1em;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--border-hover);
            background: #fff;
        }

        /* 批改結果展示區 */
        .result-text {
            font-size: 1.35rem;
            line-height: 2.5;
            letter-spacing: 0.15em;
            text-align: justify;
        }

        /* 拼音/錯字標註樣式 */
        ruby {
            ruby-position: over;
            ruby-align: center;
        }
        
        rt {
            font-size: 0.75rem;
            font-weight: bold;
            font-family: sans-serif;
            transform: translateY(-2px);
        }

        .char-correct { color: var(--correct-color); }
        .char-wrong { color: var(--wrong-color); font-weight: bold; border-bottom: 1px dashed var(--wrong-color); }
        .char-missing { color: var(--missing-color); text-decoration: underline; text-decoration-color: #ef9a9a; text-decoration-style: wavy; }
        
        .extra-chars-box {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #ffebee;
            border-left: 4px solid var(--wrong-color);
            border-radius: 4px;
            font-size: 1.1rem;
            color: var(--wrong-color);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <header class="text-center w-full max-w-4xl mb-8">
        <h1 class="text-4xl md:text-5xl font-black mb-4 text-[#3e362e] tracking-widest">
            《道德經》全篇默寫
        </h1>
        <p class="text-[#5c5042] text-lg opacity-80 tracking-wide mb-6">心如止水，不拘標點，專注還原經典本貌</p>
        
        <!-- 單元選擇區 -->
        <div class="glass-panel p-4 mb-6">
            <h3 class="text-lg font-bold mb-3 text-[#5c5042]">選擇抽題範圍：</h3>
            <div class="flex flex-wrap justify-center gap-2" id="chapter-checkboxes">
                <!-- Checkboxes will be injected here -->
            </div>
            <button onclick="drawChapter()" class="mt-5 btn-zen px-8 py-2 rounded-full font-bold text-lg tracking-widest">
                隨機抽取單元
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl w-full flex-grow relative">
        
        <!-- 默寫工作區 -->
        <div id="workspace" class="glass-panel p-6 sm:p-10 hidden flex-col">
            <h2 id="current-chapter-title" class="text-2xl font-bold mb-6 text-center text-[#5c5042] border-b border-[#c7bcab] pb-4">
                目前默寫單元：第 X 章
            </h2>
            
            <div id="input-section" class="flex flex-col">
                <textarea id="recitation-input" placeholder="請在此默寫全章內容。完全不需輸入標點符號與換行，只需輸入純文字即可..."></textarea>
                <div class="mt-6 text-center">
                    <button onclick="submitRecitation()" class="btn-zen px-10 py-3 rounded-full font-bold text-xl tracking-widest">
                        提交批改
                    </button>
                </div>
            </div>

            <!-- 批改結果區 -->
            <div id="result-section" class="hidden flex-col">
                <div id="result-content" class="result-text text-[#3e362e]">
                    <!-- 批改結果會注入在此 -->
                </div>
                <div id="extra-chars-container"></div>
                
                <div class="mt-10 flex justify-center gap-6">
                    <button onclick="retryCurrent()" class="btn-outline px-8 py-2 rounded-full font-bold text-lg tracking-widest">
                        重新默寫此章
                    </button>
                    <button onclick="drawChapter()" class="btn-zen px-8 py-2 rounded-full font-bold text-lg tracking-widest">
                        抽取下一題
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // 道德經文本庫 (依據您的規格)
        const textDatabase = {
            2: "天下皆知美之為美，斯惡已；皆知善之為善，斯不善已。故有無相生，難易相成，長短相形，高下相傾，音聲相和，前後相隨。是以聖人處無為之事，行不言之教；萬物作焉而不辭，生而不有，為而不恃，功成而弗居；夫唯弗居，是以不去。",
            3: "不尚賢，使民不爭；不貴難得之貨，使民不為盜；不見可欲，使民心不亂。是以聖人之治，虛其心，實其腹；弱其志，強其骨。常使民無知無欲，使夫智者不敢為也。為無為，則無不治。",
            7: "天長地久。天地所以長且久者，以其不自生，故能長生。是以聖人後其身而身先，外其身而身存。非以其無私耶？故能成其私。",
            10: "載營魄抱一，能無離乎？專氣致柔，能嬰兒乎？滌除玄覽，能無疵乎？愛國治民，能無為乎？天門開闔，能為雌乎？明白四達，能無知乎？生之蓄之，生而不有，為而不恃，長而不宰，是謂玄德。",
            15: "古之善為道者，微妙玄通，深不可識。夫唯不可識，故強為之容：豫兮若冬涉川，猶兮若畏四鄰，儼兮其若客，渙兮若冰之將釋，敦兮其若樸，曠兮其若穀，渾兮其若濁。孰能濁以靜之徐清？孰能安以動之徐生？保此道者不欲盈，夫唯不盈，故能蔽而新成。",
            16: "致虛極，守靜篤。萬物並作，吾以觀復。夫物芸芸，各復歸其根。歸根曰靜，是謂復命。復命曰常，不知常，妄作凶。知常容，容乃公，公乃全，全乃天，天乃道，道乃久，沒身不殆。"
        };

        const chaptersAvailable = [2, 3, 7, 10, 15, 16];
        let currentChapter = null;

        // 初始化 Checkboxes
        function initCheckboxes() {
            const container = document.getElementById('chapter-checkboxes');
            chaptersAvailable.forEach(ch => {
                const label = document.createElement('label');
                label.className = 'checkbox-wrapper';
                label.innerHTML = `
                    <input type="checkbox" value="${ch}" checked>
                    <div class="checkbox-custom"></div>
                    <span class="text-lg font-bold">第 ${ch} 章</span>
                `;
                container.appendChild(label);
            });
        }

        // 抽取單元
        function drawChapter() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const selectedChs = Array.from(checkboxes).map(cb => parseInt(cb.value));

            if (selectedChs.length === 0) {
                alert("請至少勾選一個章節！");
                return;
            }

            // 隨機抽取 (盡量不與上一題重複，除非只選一個)
            let newCh;
            do {
                newCh = selectedChs[Math.floor(Math.random() * selectedChs.length)];
            } while (newCh === currentChapter && selectedChs.length > 1);

            currentChapter = newCh;
            startRecitation();
        }

        // 準備默寫環境
        function startRecitation() {
            document.getElementById('workspace').classList.remove('hidden');
            document.getElementById('workspace').classList.add('flex');
            document.getElementById('current-chapter-title').textContent = `目前默寫單元：第 ${currentChapter} 章`;
            
            // 重置輸入區與隱藏結果區
            const textarea = document.getElementById('recitation-input');
            textarea.value = '';
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('input-section').classList.add('flex');
            
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('flex');
            
            textarea.focus();
        }

        function retryCurrent() {
            startRecitation();
        }

        // 核心批改邏輯
        function submitRecitation() {
            const userInput = document.getElementById('recitation-input').value;
            const originalText = textDatabase[currentChapter];

            // 萃取純中文字 (過濾掉所有標點、換行、空格、英數等)
            const pureUserChars = userInput.replace(/[^\u4e00-\u9fa5]/g, '');
            // 原文也應當如此定義，但因為原文是固定的，這裡過濾只是為了對位
            // const pureOrigChars = originalText.replace(/[^\u4e00-\u9fa5]/g, ''); 

            let resultHTML = '';
            let userIdx = 0; // 追蹤目前比對到使用者的第幾個純字元

            // 逐字元遍歷原始文本 (包含標點)
            for (let i = 0; i < originalText.length; i++) {
                const charOrig = originalText[i];

                // 判斷是否為中文字符。若不是中文字符 (即標點符號)，直接印出
                if (/[^\u4e00-\u9fa5]/.test(charOrig)) {
                    resultHTML += `<span class="text-gray-500">${charOrig}</span>`;
                    continue;
                }

                // 若是中文字符，則拿使用者的純字元來比對
                if (userIdx < pureUserChars.length) {
                    const charUser = pureUserChars[userIdx];
                    
                    if (charUser === charOrig) {
                        // 答對：綠色
                        resultHTML += `<span class="char-correct">${charUser}</span>`;
                    } else {
                        // 答錯：紅色，並使用 ruby 標註正確答案
                        resultHTML += `<ruby class="char-wrong">${charUser}<rt class="text-[var(--correct-color)]">${charOrig}</rt></ruby>`;
                    }
                    userIdx++;
                } else {
                    // 使用者字數不足 (漏寫)
                    resultHTML += `<span class="char-missing" title="漏字">${charOrig}</span>`;
                }
            }

            // 處理多寫的字元
            let extraHTML = '';
            if (userIdx < pureUserChars.length) {
                const extraChars = pureUserChars.substring(userIdx);
                extraHTML = `
                    <div class="extra-chars-box">
                        <strong>多餘輸入的字：</strong><br>
                        ${extraChars}
                    </div>
                `;
            }

            // 更新畫面
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('flex');
            
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('result-section').classList.add('flex');
            
            document.getElementById('result-content').innerHTML = resultHTML;
            document.getElementById('extra-chars-container').innerHTML = extraHTML;
        }

        // 初始化
        window.onload = () => {
            initCheckboxes();
        };
    </script>
</body>
</html>
